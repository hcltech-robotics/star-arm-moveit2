# joint_limits.yaml overrides/augments the URDF limits for MoveIt time parameterization.
#
# Acceleration limits are required for smooth, servo-friendly trajectories: without
# them MoveIt falls back to a generic default and produces abrupt profiles.
# joint1-3 are measured on the Cello at the default 8 W servo power: lifting the
# stretched-out arm, joint2 manages ~3 rad/s^2 and ~70 deg/s (higher limits made it fall
# 14 deg behind and abort). The wrist limits (joint4-6) are not measured yet.
# Use the scaling factors (or the RViz sliders) to go slower.
default_velocity_scaling_factor: 0.3
default_acceleration_scaling_factor: 0.3

joint_limits:
  joint1:
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 3.0
  joint2:
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 3.0
  joint3:
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 3.0
  joint4:
    has_velocity_limits: true
    max_velocity: 3.5
    has_acceleration_limits: true
    max_acceleration: 10.0
  joint5:
    has_velocity_limits: true
    max_velocity: 3.5
    has_acceleration_limits: true
    max_acceleration: 10.0
  joint6:
    has_velocity_limits: true
    max_velocity: 3.5
    has_acceleration_limits: true
    max_acceleration: 10.0
  joint7_left:
    has_velocity_limits: true
    max_velocity: 0.1
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint7_right:
    has_velocity_limits: true
    max_velocity: 0.1
    has_acceleration_limits: true
    max_acceleration: 1.0
